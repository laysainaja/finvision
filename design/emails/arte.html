<!doctype html>
<!--
  Fonte das artes dos e-mails do FinVision. Para gerar os PNGs: npm run emails:artes
  #confirmar → public/emails/primeiro-acesso.png  |  #senha → public/emails/nova-senha.png
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 600px; height: 300px; overflow: hidden; background: #fff; }
  body { font-family: 'Segoe UI', 'Segoe UI Variable', Arial, sans-serif; color: #102a2b; }
  .arte {
    position: relative; width: 600px; height: 300px; overflow: hidden;
    background: radial-gradient(circle at 85% 30%, #c9ece6 0, rgba(201,236,230,0) 55%), linear-gradient(135deg, #f1faf8 0%, #ffffff 60%, #eef7f5 100%);
  }
  .bolha { position: absolute; border-radius: 50%; background: #0f766e; opacity: .07; }
  .marca { position: absolute; left: 40px; top: 34px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; letter-spacing: -.01em; color: #0f766e; }
  .marca .logo { width: 34px; height: 34px; border-radius: 9px; background: #0f766e; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(15,118,110,.25); }
  .texto { position: absolute; left: 40px; top: 102px; width: 300px; }
  .selo { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #0f766e; background: #d7f0eb; padding: 5px 10px; border-radius: 99px; margin-bottom: 12px; }
  h1 { font-size: 30px; line-height: 1.12; font-weight: 700; letter-spacing: -.02em; color: #102a2b; }
  p { margin-top: 12px; font-size: 15.5px; line-height: 1.45; color: #46545a; }
  .ilustra { position: absolute; right: 34px; top: 40px; width: 230px; height: 230px; }
  .variante { display: none; }
  body.confirmar .v-confirmar, body.senha .v-senha { display: block; }
</style>
</head>
<body>
<div class="arte">
  <div class="bolha" style="width:260px;height:260px;right:-70px;bottom:-110px"></div>
  <div class="bolha" style="width:90px;height:90px;left:300px;top:-40px;opacity:.05"></div>
  <div class="bolha" style="width:40px;height:40px;left:250px;bottom:30px;opacity:.08"></div>

  <div class="marca">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 32 32"><path d="M7 21l6-6 5 4 7-9" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    FinVision
  </div>

  <!-- Primeiro acesso -->
  <div class="variante v-confirmar">
    <div class="texto">
      <span class="selo">Primeiro acesso</span>
      <h1>Bem-vindo(a) ao FinVision!</h1>
      <p>Falta só confirmar seu e-mail para começar a organizar suas finanças.</p>
    </div>
    <svg class="ilustra" viewBox="0 0 230 230">
      <!-- cartão de gráfico ao fundo -->
      <g transform="rotate(-8 150 70)">
        <rect x="104" y="18" width="104" height="78" rx="14" fill="#ffffff" stroke="#cfe7e2" stroke-width="2"/>
        <rect x="120" y="62" width="12" height="20" rx="3" fill="#9fd8cd"/>
        <rect x="140" y="50" width="12" height="32" rx="3" fill="#5cbcaa"/>
        <rect x="160" y="38" width="12" height="44" rx="3" fill="#0f766e"/>
        <rect x="180" y="54" width="12" height="28" rx="3" fill="#5cbcaa"/>
      </g>
      <!-- envelope -->
      <g filter="url(#sombra)">
        <rect x="22" y="82" width="170" height="118" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
        <path d="M24 92 L107 150 L190 92" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/>
        <path d="M26 196 L84 136 M188 196 L130 136" stroke="#cfe7e2" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- selo de confirmação -->
      <circle cx="180" cy="180" r="30" fill="#0f766e" stroke="#ffffff" stroke-width="5"/>
      <path d="M166 180 l10 10 l19 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- brilhos -->
      <path d="M40 40 v14 M33 47 h14" stroke="#5cbcaa" stroke-width="3" stroke-linecap="round"/>
      <path d="M78 22 v8 M74 26 h8" stroke="#9fd8cd" stroke-width="2.5" stroke-linecap="round"/>
      <defs><filter id="sombra" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f766e" flood-opacity=".18"/></filter></defs>
    </svg>
  </div>

  <!-- Esqueci minha senha -->
  <div class="variante v-senha">
    <div class="texto">
      <span class="selo">Nova senha</span>
      <h1>Vamos criar uma nova senha?</h1>
      <p>É rapidinho! Em poucos segundos você volta a acessar sua conta com segurança.</p>
    </div>
    <svg class="ilustra" viewBox="0 0 230 230">
      <!-- escudo ao fundo -->
      <path d="M150 16 l52 18 v38 c0 34 -22 56 -52 68 c-30 -12 -52 -34 -52 -68 v-38 z" fill="#ffffff" stroke="#cfe7e2" stroke-width="2"/>
      <path d="M150 34 l36 12 v26 c0 24 -15 40 -36 49 c-21 -9 -36 -25 -36 -49 v-26 z" fill="#d7f0eb"/>
      <!-- cadeado -->
      <g filter="url(#sombra2)">
        <path d="M62 110 v-26 a40 40 0 0 1 80 0 v26" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
        <rect x="38" y="104" width="128" height="104" rx="18" fill="#0f766e"/>
        <rect x="38" y="104" width="128" height="18" rx="9" fill="#13897f"/>
        <circle cx="102" cy="150" r="13" fill="#ffffff"/>
        <rect x="97" y="156" width="10" height="26" rx="5" fill="#ffffff"/>
      </g>
      <!-- selo de renovar -->
      <circle cx="176" cy="186" r="30" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
      <path d="M163 182 a14 14 0 0 1 25 -7" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <path d="M190 166 l-1 11 l-11 -2" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M189 190 a14 14 0 0 1 -25 7" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <path d="M162 206 l1 -11 l11 2" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- brilhos -->
      <path d="M30 46 v14 M23 53 h14" stroke="#5cbcaa" stroke-width="3" stroke-linecap="round"/>
      <path d="M70 26 v8 M66 30 h8" stroke="#9fd8cd" stroke-width="2.5" stroke-linecap="round"/>
      <defs><filter id="sombra2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f766e" flood-opacity=".25"/></filter></defs>
    </svg>
  </div>
</div>
<script>document.body.className = location.hash.slice(1) || 'confirmar';</script>
</body>
</html>
